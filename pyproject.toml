[project]
name = "pdf-tree-01v"
version = "0.1.0"
description = "PDF tree builder using docling. Architecture designed by Jonathan Potes, CTO."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.3",
    "streamlit>=1.57",
    "watchdog>=6.0.0",
    "python-dotenv>=1.0",
    "docling>=2.0",
    "rapidfuzz>=3.0",
]

# ── uv ────────────────────────────────────────────────────────────────────────
# Setup: uv sync
# Start: uv run streamlit run streamlit_app/app.py
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app/**" = ["E402", "I001", "RUF001", "C408", "B007", "F841"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "docling.*"]
ignore_missing_imports = true
ignore_errors = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
